name: CI

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Offline test suite
        env:
          LSM_RUN_REAL_API: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider --ignore=tests/test_real_api.py
